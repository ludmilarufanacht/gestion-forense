services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-forense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestion_forense}
      POSTGRES_USER: ${DB_USER:-forense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-forense}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forense} -d ${DB_NAME:-gestion_forense}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
